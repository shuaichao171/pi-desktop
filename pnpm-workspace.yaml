packages:
  - 'packages/*'

# pnpm 11 build-script policy (replaces onlyBuiltDependencies).
allowBuilds:
  node-pty: true
  electron: true
  electron-winstaller: true
  esbuild: true
  '@tailwindcss/oxide': true
  '@google/genai': true
  protobufjs: true
  # computer-use FFI: the prebuilt binary ships in @koromix/koffi-<platform>
  # optional packages, so the cnoke source-build fallback must not run.
  koffi: false

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.6.0'
  - '@earendil-works/pi-ai@1.6.0'
  - '@earendil-works/pi-coding-agent@1.6.0'
  - '@earendil-works/pi-codemode@1.6.0'
  - '@earendil-works/pi-mcp@1.6.0'
  - '@earendil-works/pi-schema@1.6.0'
  - '@earendil-works/pi-telemetry@1.6.0'
  - '@earendil-works/pi-tui@1.6.0'
  - electron@44.4.5

# Keep installer transitive dependencies outside pnpm's minimum release age window.
overrides:
  '@electron/universal>fs-extra': 11.4.0
  '@electron/windows-sign>fs-extra': 11.4.0

# The Pi 1.6.0 Google adapter needs the Gemini XHIGH mapping. A later SDK can
# leave this version-specific patch unused once it passes the request test.
allowUnusedPatches: true
patchedDependencies:
  '@earendil-works/pi-ai@1.6.0': patches/@earendil-works__pi-ai@1.6.0.patch
