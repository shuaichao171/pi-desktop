packages:
  - 'packages/*'

# pnpm 11 build-script policy (replaces onlyBuiltDependencies).
allowBuilds:
  node-pty: true
  electron: true
  electron-winstaller: true
  esbuild: true
  '@tailwindcss/oxide': true
  '@google/genai': true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.4.0'
  - '@earendil-works/pi-ai@1.4.0'
  - '@earendil-works/pi-coding-agent@1.4.0'
  - '@earendil-works/pi-codemode@1.4.0'
  - '@earendil-works/pi-mcp@1.4.0'
  - '@earendil-works/pi-telemetry@1.4.0'
  - '@earendil-works/pi-tui@1.4.0'
  - electron@44.4.5

# Keep installer transitive dependencies outside pnpm's minimum release age window.
overrides:
  '@electron/universal>fs-extra': 11.4.0
  '@electron/windows-sign>fs-extra': 11.4.0
