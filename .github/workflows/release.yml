name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag, for example v0.1.1
        required: true
        type: string
      publish:
        description: Publish the completed release and make it available to app updates
        default: false
        type: boolean

permissions:
  contents: read

env:
  PI_DESKTOP_UPDATE_URL: ${{ vars.PI_DESKTOP_UPDATE_URL || 'https://github.com/shuaichao171/pi-desktop/releases/latest/download/' }}

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prerequisites:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      windows_signed: ${{ steps.plan.outputs.windows_signed }}
      macos: ${{ steps.plan.outputs.macos }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Validate requested tag before checkout
        shell: bash
        run: |
          node <<'NODE'
          const tag = process.env.RELEASE_TAG;
          if (!tag || tag !== tag.trim() || !/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) throw new Error('A stable vX.Y.Z tag is required');
          NODE
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Validate versions, update feed and optional signing
        id: plan
        run: node .github/scripts/release-plan.mjs

  build-windows:
    needs: prerequisites
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prerequisites.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/sync-pi.mjs --verify
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build Windows packages and update metadata
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          pnpm dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify configured signing, update metadata and Pi runtime
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $signed = '${{ needs.prerequisites.outputs.windows_signed }}' -eq 'true'
          foreach ($kind in @('Setup', 'Portable')) {
            $path = "release/Pi-Desktop-$kind-$version-x64.exe"
            if (-not (Test-Path $path)) { throw "Missing $path" }
            if ($signed) {
              $signature = Get-AuthenticodeSignature -FilePath $path
              if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature for $path`: $($signature.Status)" }
              if ($kind -eq 'Setup') {
                $publisher = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
              }
            }
          }
          $update = Get-Content 'release/latest.yml' -Raw
          if (-not $update.Contains("Pi-Desktop-Setup-$version-x64.exe") -or $update.Contains('Pi-Desktop-Portable-')) {
            throw 'latest.yml must refer to the NSIS installer, not the portable executable'
          }
          if (-not (Test-Path 'release/win-unpacked/resources/update-config.json')) { throw 'Update feed config is missing from package' }
          $appUpdate = Get-Content 'release/win-unpacked/resources/app-update.yml' -Raw
          if ($signed -and (-not $publisher -or $appUpdate -notmatch '(?m)^publisherName:\s*(\r?\n\s*-\s*\S+|\S+)' -or -not $appUpdate.Contains($publisher))) {
            throw 'app-update.yml must include the installer certificate publisherName for updater signature verification'
          }
          $asar = (Resolve-Path 'release/win-unpacked/resources/app.asar').Path
          $entries = pnpm --filter @pidesktop/desktop exec asar list $asar
          if (-not ($entries -match 'out[\\/]main[\\/]agentHost\.js')) {
            throw 'Isolated Pi agent host is missing from app.asar'
          }
          if (-not ($entries -match 'node_modules[\\/]@earendil-works[\\/]pi-coding-agent[\\/]dist[\\/]index.js')) {
            throw 'Pi SDK is missing from app.asar'
          }
          if (-not ($entries -match 'node_modules[\\/]@silvia-odwyer[\\/]photon-node[\\/]photon_rs_bg.wasm')) {
            throw 'Pi image runtime is missing from app.asar'
          }
          if (-not ($entries -match '@esbuild[\\/]win32-x64[\\/]esbuild.exe')) { throw 'Pi Chord Windows esbuild binary is missing' }
          $esbuildBinary = Get-ChildItem 'release/win-unpacked/resources/app.asar.unpacked' -Recurse -File -Filter esbuild.exe |
            Where-Object { $_.FullName -match '@esbuild[\\/]win32-x64[\\/]esbuild.exe$' } | Select-Object -First 1
          if (-not $esbuildBinary) {
            throw 'Pi Chord Windows esbuild binary is not unpacked for execution'
          }
          $esbuildVersion = & $esbuildBinary.FullName --version
          $expectedEsbuildVersion = (Get-Content packages/desktop/package.json | ConvertFrom-Json).optionalDependencies.'@esbuild/win32-x64'
          if ($LASTEXITCODE -ne 0 -or $esbuildVersion -ne $expectedEsbuildVersion) { throw 'Packaged Pi Chord esbuild binary cannot run' }
      - uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-windows
          path: |
            release/Pi-Desktop-Setup-${{ needs.prerequisites.outputs.version }}-x64.exe
            release/Pi-Desktop-Portable-${{ needs.prerequisites.outputs.version }}-x64.exe
            release/Pi-Desktop-Setup-${{ needs.prerequisites.outputs.version }}-x64.exe.blockmap
            release/Pi-Desktop-Portable-${{ needs.prerequisites.outputs.version }}-x64.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  build-macos:
    needs: prerequisites
    if: needs.prerequisites.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            macho: x86_64
          - runner: macos-15
            arch: arm64
            macho: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prerequisites.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/sync-pi.mjs --verify
      - run: pnpm build
      - name: Embed public update feed
        run: node scripts/prepare-update-config.mjs
      - name: Build signed and notarized native macOS package
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @pidesktop/desktop exec electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config.publish.provider=generic "--config.publish.url=$PI_DESKTOP_UPDATE_URL"
      - name: Verify signed app, native esbuild and update payload
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          arch='${{ matrix.arch }}'
          test -f 'release/latest-mac.yml'
          test -f "release/Pi-Desktop-${version}-${arch}.dmg"
          test -f "release/Pi-Desktop-${version}-${arch}.zip"
          grep -F "Pi-Desktop-${version}-${arch}.zip" release/latest-mac.yml >/dev/null
          app_dir='mac'
          if [[ "$arch" == arm64 ]]; then app_dir='mac-arm64'; fi
          app="release/${app_dir}/Pi Desktop.app"
          test "$(lipo -archs "$app/Contents/MacOS/Pi Desktop")" = '${{ matrix.macho }}'
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
          test -f "$app/Contents/Resources/update-config.json"
          asar="$(realpath "$app/Contents/Resources/app.asar")"
          entries="$(pnpm --filter @pidesktop/desktop exec asar list "$asar")"
          grep -F 'out/main/agentHost.js' <<< "$entries" >/dev/null
          grep -F 'node_modules/@earendil-works/pi-coding-agent/dist/index.js' <<< "$entries" >/dev/null
          grep -F 'node_modules/@silvia-odwyer/photon-node/photon_rs_bg.wasm' <<< "$entries" >/dev/null
          grep -F "@esbuild/darwin-${arch}/bin/esbuild" <<< "$entries" >/dev/null
          esbuild_binary="$(find "$app/Contents/Resources/app.asar.unpacked" -path "*/@esbuild/darwin-${arch}/bin/esbuild" -type f -print -quit)"
          test -n "$esbuild_binary"
          test "$(lipo -archs "$esbuild_binary")" = '${{ matrix.macho }}'
          esbuild_version="$(node -p "require('./packages/desktop/package.json').optionalDependencies['@esbuild/darwin-${arch}']")"
          test "$("$esbuild_binary" --version)" = "$esbuild_version"
          mv release/latest-mac.yml "release/latest-mac-${arch}.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-macos-${{ matrix.arch }}
          path: |
            release/Pi-Desktop-${{ needs.prerequisites.outputs.version }}-${{ matrix.arch }}.dmg
            release/Pi-Desktop-${{ needs.prerequisites.outputs.version }}-${{ matrix.arch }}.zip
            release/Pi-Desktop-${{ needs.prerequisites.outputs.version }}-${{ matrix.arch }}.zip.blockmap
            release/latest-mac-${{ matrix.arch }}.yml
          if-no-files-found: error

  build-linux:
    needs: prerequisites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prerequisites.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/sync-pi.mjs --verify
      - name: Build Linux packages and update metadata
        run: pnpm dist:linux
      - name: Verify update metadata and Pi runtime
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -f "release/Pi-Desktop-${version}-x64.AppImage"
          test -f "release/Pi-Desktop-${version}-x64.deb"
          grep -F "Pi-Desktop-${version}-x64.AppImage" release/latest-linux.yml >/dev/null
          test -f 'release/linux-unpacked/resources/update-config.json'
          asar="$(realpath release/linux-unpacked/resources/app.asar)"
          entries="$(pnpm --filter @pidesktop/desktop exec asar list "$asar")"
          grep -F 'out/main/agentHost.js' <<< "$entries" >/dev/null
          grep -F 'node_modules/@earendil-works/pi-coding-agent/dist/index.js' <<< "$entries" >/dev/null
          grep -F 'node_modules/@silvia-odwyer/photon-node/photon_rs_bg.wasm' <<< "$entries" >/dev/null
          grep -F '@esbuild/linux-x64/bin/esbuild' <<< "$entries" >/dev/null
          esbuild_binary="$(find release/linux-unpacked/resources/app.asar.unpacked -path '*/@esbuild/linux-x64/bin/esbuild' -type f -print -quit)"
          test -n "$esbuild_binary"
          esbuild_version="$(node -p "require('./packages/desktop/package.json').optionalDependencies['@esbuild/linux-x64']")"
          test "$("$esbuild_binary" --version)" = "$esbuild_version"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-linux
          path: |
            release/Pi-Desktop-${{ needs.prerequisites.outputs.version }}-x64.AppImage
            release/Pi-Desktop-${{ needs.prerequisites.outputs.version }}-x64.AppImage.blockmap
            release/Pi-Desktop-${{ needs.prerequisites.outputs.version }}-x64.deb
            release/latest-linux.yml
          if-no-files-found: error

  release:
    needs: [prerequisites, build-windows, build-macos, build-linux]
    if: >-
      ${{ !cancelled() && needs.prerequisites.result == 'success' &&
      needs.build-windows.result == 'success' && needs.build-linux.result == 'success' &&
      (needs.build-macos.result == 'success' ||
      (needs.prerequisites.outputs.macos == 'false' && needs.build-macos.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prerequisites.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prerequisites.outputs.version }}
      RELEASE_MACOS: ${{ needs.prerequisites.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prerequisites.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter .
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-desktop-*
          path: release
          merge-multiple: true
      - name: Merge signed macOS architecture update metadata
        if: needs.prerequisites.outputs.macos == 'true'
        run: node .github/scripts/merge-mac-updates.mjs release
      - name: Verify artifact set and update hashes
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          args=(release --version "$RELEASE_VERSION")
          if [[ "$RELEASE_MACOS" == true ]]; then args+=(--macos); fi
          node .github/scripts/verify-release-artifacts.mjs "${args[@]}"
      - name: Refuse to replace an already published version
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const existing = releases.find(release => release.tag_name === process.env.RELEASE_TAG);
            if (existing && !existing.draft) throw new Error('This version is already public. Bump the version and create a new stable tag.');
      # Keep assets private until every upload is complete. Publishing an empty
      # release first could make /releases/latest/download/ point at missing files.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prerequisites.outputs.tag }}
          target_commitish: ${{ needs.prerequisites.outputs.sha }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.artifacts.outputs.files }}
      - name: Verify draft contains exactly this release batch
        uses: actions/github-script@v7
        env:
          RELEASE_FILES: ${{ steps.artifacts.outputs.files }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const expected = new Map(process.env.RELEASE_FILES.trim().split('\n').map(file => [path.basename(file), fs.statSync(file).size]));
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const release = releases.find(release => release.tag_name === process.env.RELEASE_TAG);
            if (!release?.draft) throw new Error('Release is missing or became public before asset verification completed.');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id: release.id, per_page: 100 });
            if (assets.length !== expected.size || assets.some(asset => expected.get(asset.name) !== asset.size || asset.state !== 'uploaded')) {
              throw new Error('Draft assets differ from the verified build. Remove stale or unexpected assets from this draft and rerun.');
            }
      - name: Publish completed release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
